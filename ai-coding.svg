<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="نافذة كود برمجي وبجانبها فقاعة شرح من ChatGPT" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="640" height="360" rx="18" fill="#e3f1ef"/>
<rect x="40" y="50" width="330" height="190" rx="12" fill="#0e2a33"/>
<circle cx="64" cy="72" r="6" fill="#f4b860"/><circle cx="84" cy="72" r="6" fill="#7ccfc3"/><circle cx="104" cy="72" r="6" fill="#9fb4ba"/>
<g font-family="Consolas,Menlo,monospace" font-size="20" direction="ltr">
<text x="64" y="125" fill="#7ccfc3">let</text><text x="106" y="125" fill="#ffffff">total</text><text x="170" y="125" fill="#f4b860">=</text><text x="192" y="125" fill="#ffffff">5 + 3;</text>
<text x="64" y="165" fill="#9fb4ba">// total = 8</text></g>
<rect x="300" y="200" width="300" height="110" rx="14" fill="#ffffff" stroke="#0f766e" stroke-width="2"/>
<g font-family="Tahoma,Arial,sans-serif" font-size="17" fill="#10262c" text-anchor="end">
<text x="580" y="235" font-weight="bold">ChatGPT</text>
<text x="580" y="264">let لتعريف متغير اسمه total</text>
<text x="580" y="289">وقيمته ناتج جمع 5 و3</text></g>
</svg>
